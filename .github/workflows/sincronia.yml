name: Sincronia (Pipedrive e GA4)

# A cada 2 horas (UTC) traz SO o que mudou: cadastros, negocios, historico de etapas e GA4 (ultimos 7 dias).
# Pipedrive e Google: somente leitura. Grava no banco pelo papel orq_sync (sem permissao de apagar).
# Nenhum gatilho de pull request: segredos nunca ficam ao alcance de codigo de terceiros.
on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sincronia
  cancel-in-progress: false

jobs:
  sincronia:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PIPEDRIVE_DOMAIN: ${{ secrets.PIPEDRIVE_DOMAIN }}
      PIPEDRIVE_API_TOKEN: ${{ secrets.PIPEDRIVE_API_TOKEN }}
      SYNC_DB_URL: ${{ secrets.SYNC_DB_URL }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      GOOGLE_SA_CLIENT_EMAIL: ${{ secrets.GOOGLE_SA_CLIENT_EMAIL }}
      GOOGLE_SA_PRIVATE_KEY: ${{ secrets.GOOGLE_SA_PRIVATE_KEY }}
      GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
      GA4_PROPERTY_ID_CLINIC: ${{ secrets.GA4_PROPERTY_ID_CLINIC }}
      GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
      GSC_SITE_URL_CLINIC: ${{ secrets.GSC_SITE_URL_CLINIC }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      META_AD_ACCOUNT_RH: ${{ secrets.META_AD_ACCOUNT_RH }}
      META_AD_ACCOUNT_CLINIC: ${{ secrets.META_AD_ACCOUNT_CLINIC }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Cada etapa roda mesmo se a anterior falhar, e o job termina vermelho (o GitHub avisa por e-mail).
      - name: Cadastros (pipelines, etapas, usuarios e campos)
        id: cadastros
        continue-on-error: true
        run: npx tsx scripts/datahub-sync.ts --apply
      - name: Negocios (abertos, arquivados e excluidos)
        id: negocios
        continue-on-error: true
        run: npx tsx scripts/datahub-sync.ts --entities deals,deals_archived,deals_deleted --apply   # ao final atualiza crm.deal_atributos (so o que mudou)
      - name: Historico de etapas (so os negocios sem historico)
        id: historico
        continue-on-error: true
        run: |
          npx tsx scripts/datahub-sync.ts --entities deal_history --created-year 2026 --apply
          npx tsx scripts/datahub-sync.ts --entities deal_history --created-year 2025 --apply
          # leads ANTIGOS (criados antes de 2025) que foram mexidos no Pipedrive: relê o historico so dos ja lidos que mudaram de etapa ou dos alterados nos ultimos 14 dias
          npx tsx scripts/datahub-sync.ts --entities deal_history --created-year antigos --apply
      - name: GA4 (ultimos 7 dias)
        id: ga4
        continue-on-error: true
        run: |
          npx tsx scripts/ga4-sync.ts --apply
          # historico comprimido: arquiva UMA vez cada mes fechado (35 dias depois do fim); nao relê nem regrava o que ja foi arquivado
          npx tsx scripts/ga4-arquivar.ts --apply
      - name: Search Console (ultimos dias)
        id: gsc
        if: ${{ env.GSC_SITE_URL != '' || env.GSC_SITE_URL_CLINIC != '' }}
        continue-on-error: true
        run: npx tsx scripts/gsc-sync.ts --apply
      # Meta Ads: SO a estrutura (campanhas, conjuntos, anuncios) e a ligacao com o Pipedrive. O DESEMPENHO da Meta nao roda aqui: so por rodada
      # autorizada (scripts/meta-rodada.ts: simulacao, cartao e "pode seguir" do Pablo), nunca agendado. A etapa so roda com a variavel
      # META_ATIVO = "true"; limite de 25 minutos.
      - name: Meta Ads (estrutura e ligacao com o Pipedrive)
        id: meta
        if: ${{ vars.META_ATIVO == 'true' }}
        continue-on-error: true
        timeout-minutes: 25
        run: |
          npx tsx scripts/meta-sync.ts --apply --so estrutura
          npx tsx scripts/meta-sync.ts --apply --so ligacao
      - name: Falhar se alguma etapa falhou
        if: ${{ steps.cadastros.outcome == 'failure' || steps.negocios.outcome == 'failure' || steps.historico.outcome == 'failure' || steps.ga4.outcome == 'failure' || steps.gsc.outcome == 'failure' || steps.meta.outcome == 'failure' }}
        run: |
          echo "Etapa com falha: cadastros=${{ steps.cadastros.outcome }} negocios=${{ steps.negocios.outcome }} historico=${{ steps.historico.outcome }} ga4=${{ steps.ga4.outcome }} meta=${{ steps.meta.outcome }}"
          exit 1
