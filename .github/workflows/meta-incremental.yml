name: Meta Ads incremental (de 2 em 2 horas)

# De 2 em 2 horas (UTC) atualiza SO o dia de HOJE do desempenho da Meta; as 06 UTC, so as ultimas 48h (fecha o dia anterior).
# Nunca faz carga historica. Meta: somente leitura (so GET, so graph.facebook.com, token no cabecalho). Grava pelo papel orq_sync (sem permissao de apagar).
# Para a 75% da cota da Meta (espera e relê so o bloco de 7 dias; se continuar quente, termina sem falhar e a proxima hora continua).
# Trimestres FECHADOS nunca sao tocados. So roda com a variavel do repositorio META_ATIVO = "true". Nenhum gatilho de pull request.
on:
  schedule:
    - cron: '23 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meta-incremental
  cancel-in-progress: false

jobs:
  incremental:
    if: ${{ vars.META_ATIVO == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SYNC_DB_URL: ${{ secrets.SYNC_DB_URL }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      META_AD_ACCOUNT_RH: ${{ secrets.META_AD_ACCOUNT_RH }}
      META_AD_ACCOUNT_CLINIC: ${{ secrets.META_AD_ACCOUNT_CLINIC }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Meta Ads, so os ultimos dias
        run: npx tsx scripts/meta-incremental.ts --apply
