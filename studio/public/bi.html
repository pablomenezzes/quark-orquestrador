<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BI</title>
  <link rel="stylesheet" href="/s/studio.css">
  <style>
    /* Paleta de dados validada (scripts/validate_palette.js da skill dataviz): categórica slots 1-3 e rampa sequencial azul. */
    .bi-root {
      color-scheme: light;
      --viz-surface: #fcfcfb; --viz-ink: #0b0b0b; --viz-ink-2: #52514e; --viz-muted: #898781; --viz-grid: #e1e0d9; --viz-axis: #c3c2b7;
      --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a;
      --seq-1: #86b6ef; --seq-2: #6da7ec; --seq-3: #5598e7; --seq-4: #2a78d6; --seq-5: #256abf; --seq-6: #1c5cab;
    }
    @media (prefers-color-scheme: dark) {
      :root:where(:not([data-theme='light'])) .bi-root {
        color-scheme: dark;
        --viz-surface: #1a1a19; --viz-ink: #ffffff; --viz-ink-2: #c3c2b7; --viz-muted: #898781; --viz-grid: #2c2c2a; --viz-axis: #383835;
        --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70;
        --seq-1: #86b6ef; --seq-2: #6da7ec; --seq-3: #5598e7; --seq-4: #3987e5; --seq-5: #2a78d6; --seq-6: #256abf;
      }
    }
    .wrap { max-width: 1240px; margin: 0 auto; padding: 20px; }
    .filtros { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; padding: 12px 14px; }
    .filtros label { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 3px; }
    .filtros select, .filtros input { padding: 6px 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font: inherit; }
    .grade { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
    .bi-card { background: var(--viz-surface); color: var(--viz-ink); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px 14px; min-width: 0; }
    .bi-card.cheia { grid-column: 1 / -1; }
    .bi-head { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 4px; }
    .bi-head h2 { font-size: 16px; margin: 0; flex: 1; }
    .bi-pergunta { color: var(--viz-ink-2); font-size: 13px; margin: 0 0 10px; }
    .bi-tools { display: flex; gap: 6px; }
    .bi-tools button { padding: 3px 9px; font-size: 12px; border-radius: 7px; border: 1px solid var(--border); background: transparent; color: var(--viz-ink-2); cursor: pointer; }
    .bi-tools button[aria-pressed='true'] { background: var(--accent-soft); color: var(--accent); border-color: transparent; font-weight: 600; }
    .bi-tools button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    details.como { font-size: 12.5px; color: var(--viz-ink-2); margin-top: 10px; }
    details.como summary { cursor: pointer; color: var(--viz-muted); }
    .aviso { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 7px 10px; font-size: 12.5px; margin: 8px 0 0; }
    .erro { background: var(--danger-soft); color: var(--danger); border-radius: 8px; padding: 10px 12px; font-size: 13px; }
    /* stat tiles */
    .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
    .tile { border: 1px solid var(--viz-grid); border-radius: 10px; padding: 12px 14px; }
    .tile .v { font-size: 28px; font-weight: 650; letter-spacing: -0.02em; line-height: 1.15; }
    .tile .l { font-size: 13px; color: var(--viz-ink-2); margin-top: 2px; }
    .tile .d { font-size: 11.5px; color: var(--viz-muted); margin-top: 4px; }
    /* barras */
    .barras { display: flex; flex-direction: column; gap: 6px; }
    .barra { display: grid; grid-template-columns: minmax(130px, 34%) 1fr; gap: 10px; align-items: center; }
    .barra .rot { font-size: 13px; color: var(--viz-ink); overflow-wrap: anywhere; line-height: 1.25; }
    .barra .trilho { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .barra .fill { height: 20px; border-radius: 0 4px 4px 0; min-width: 2px; flex: none; }
    .barra .val { font-size: 13px; font-variant-numeric: tabular-nums; color: var(--viz-ink); white-space: nowrap; }
    .barra .det { font-size: 12px; color: var(--viz-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .barra:hover .rot, .barra:hover .val { text-decoration: underline dotted; }
    /* colunas */
    .legenda { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12.5px; color: var(--viz-ink-2); margin-bottom: 6px; }
    .legenda i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
    svg.col { width: 100%; height: auto; display: block; overflow: visible; }
    svg.col text { fill: var(--viz-muted); font-size: 11px; font-family: var(--font); }
    svg.col .grid { stroke: var(--viz-grid); stroke-width: 1; }
    svg.col .eixo { stroke: var(--viz-axis); stroke-width: 1; }
    svg.col .hit:hover { fill: var(--viz-grid); fill-opacity: 0.55; }
    /* tabela */
    .tabela-wrap { overflow: auto; max-height: 420px; }
    table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.t th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--viz-muted); padding: 6px 8px; border-bottom: 1px solid var(--viz-axis); position: sticky; top: 0; background: var(--viz-surface); }
    table.t td { padding: 6px 8px; border-bottom: 1px solid var(--viz-grid); color: var(--viz-ink); }
    table.t .num { text-align: right; font-variant-numeric: tabular-nums; }
    #tip { position: fixed; z-index: 20; pointer-events: none; background: var(--viz-surface, #fff); color: var(--viz-ink, #111); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; box-shadow: 0 4px 16px rgba(0,0,0,.18); max-width: 320px; }
    #tip b { display: block; margin-bottom: 3px; }
    #tip .lin { display: flex; align-items: center; gap: 6px; }
    #tip .lin i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }
    .rodape { color: var(--muted); font-size: 12.5px; margin-top: 18px; }
    @media (max-width: 860px) { .grade { grid-template-columns: 1fr; } .barra { grid-template-columns: 1fr; gap: 2px; } }
  </style>
</head>
<body>
  <header class="top">
    <h1>BI</h1>
    <span class="chip accent">Data Hub · Pipedrive</span>
    <span class="spacer"></span>
    <a href="/painel" style="font-size:14px;font-weight:600">Painel de Dados →</a>
    <a href="/" class="muted" style="font-size:14px">← Quark Studio (formulários)</a>
  </header>

  <div class="wrap bi-root">
    <div id="aviso"></div>
    <section class="card filtros" aria-label="Filtros">
      <label>Período (criação do negócio)
        <select id="f-periodo"></select>
      </label>
      <label id="f-de-l" hidden>De <input id="f-de" type="date"></label>
      <label id="f-ate-l" hidden>Até <input id="f-ate" type="date"></label>
      <label>Produto
        <select id="f-produto"><option value="">Todos</option><option value="rh">RH (QuarkRH)</option><option value="clinic">Clínica (QuarkClinic)</option></select>
      </label>
      <label>Pipeline
        <select id="f-pipeline"><option value="">Todos</option></select>
      </label>
      <span class="spacer"></span>
      <span id="f-status" class="muted" style="font-size:12.5px"></span>
    </section>
    <div id="grade" class="grade"></div>
    <p class="rodape">As análises são blocos independentes: peça uma nova análise ou um novo KPI e ela entra aqui com os mesmos filtros, a mesma tabela e a exportação para CSV. Só leitura: nada aqui altera o Pipedrive nem o banco.</p>
    <div id="tip" hidden></div>
  </div>
  <script type="module" src="/s/bi.js"></script>
</body>
</html>
