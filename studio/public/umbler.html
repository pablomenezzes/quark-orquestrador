<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Umbler · Quark Dados</title>
  <link rel="stylesheet" href="/s/studio.css">
  <style>
    .wrap { max-width: 1280px; margin: 0 auto; padding: 16px 20px 40px; }
    .cab h1 { font-size: 24px; letter-spacing: -.01em; }
    .cab p { margin: 4px 0 12px; color: var(--muted); font-size: 13px; max-width: 820px; }
    .abas { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    .aba { padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; font-weight: 600; color: var(--text); }
    .aba[aria-selected='true'] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    .filtros { position: sticky; top: 0; z-index: 4; display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 12px; padding: 12px 14px; }
    .filtros label, .form label { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 3px; }
    .filtros select, .filtros input, .form input, .form select { padding: 6px 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 14px; max-width: 240px; }
    .filtros .chk { flex-direction: row; align-items: center; gap: 6px; font-size: 13px; color: var(--text); }
    .comp { padding: 10px 14px; margin-bottom: 12px; font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 18px; }
    .comp b { font-variant-numeric: tabular-nums; }
    .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
    .kpi { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; background: var(--surface); min-width: 0; }
    .kpi .n { font-size: 12.5px; color: var(--muted); }
    .kpi .v { font-size: 26px; font-weight: 650; letter-spacing: -.02em; margin: 6px 0 4px; white-space: nowrap; }
    .kpi .d { font-size: 11.5px; color: var(--muted); }
    .nd { color: var(--muted); font-style: italic; border-bottom: 1px dotted var(--muted); cursor: help; font-size: .8em; font-weight: 500; letter-spacing: 0; }
    .secao { margin: 22px 0 8px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
    .secao h2 { font-size: 16px; }
    .secao span { color: var(--muted); font-size: 12.5px; }
    .card2 { border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; background: var(--surface); min-width: 0; margin-bottom: 12px; }
    .par { display: grid; grid-template-columns: 1fr 1.4fr; gap: 12px; align-items: start; }
    .passo { display: grid; grid-template-columns: 170px 1fr 170px; gap: 10px; align-items: center; font-size: 13px; margin: 8px 0; }
    .passo .fill { height: 14px; border-radius: 0 4px 4px 0; background: var(--accent); min-width: 2px; }
    .passo .n { text-align: right; font-variant-numeric: tabular-nums; }
    .tabela-wrap { overflow: auto; }
    table.t { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 900px; }
    table.t th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    table.t th.sc { cursor: pointer; user-select: none; }
    table.t th.sc[aria-sort] { color: var(--text); }
    table.t td { padding: 7px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
    table.t tr.sel td { background: var(--accent-soft); }
    table.t tbody tr { cursor: pointer; }
    table.t .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    table.t td small { display: block; color: var(--muted); font-size: 11.5px; }
    .pill { display: inline-block; padding: 1px 8px; border-radius: 6px; font-size: 11.5px; font-weight: 600; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
    .pill.bom { background: var(--ok-soft); color: var(--ok); } .pill.atencao { background: var(--warn-soft); color: var(--warn); }
    .aviso { margin: 0 0 12px; }
    .lista-item { display: flex; gap: 10px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    .lista-item:last-child { border: 0; }
    .lista-item .nome { flex: 1; min-width: 200px; }
    .lista-item small { color: var(--muted); display: block; }
    .form { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin-top: 8px; }
    .vazio { text-align: center; padding: 18px; color: var(--muted); }
    @media (max-width: 1000px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .par { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header class="top" data-pagina="umbler"></header>
  <div class="wrap">
    <div class="cab">
      <h1>Umbler <span class="muted" style="font-weight:400">/ custo e efetividade dos envios e fluxos</span></h1>
      <p>Lê os envios em massa (templates e fluxos) da Umbler, <b>somente leitura</b>. Nada é gravado na Umbler, no Pipedrive nem no banco. Escolha em Configuração o que é do Marketing.</p>
    </div>
    <div class="abas" role="tablist" id="abas" aria-label="Seções">
      <button class="aba" role="tab" data-aba="painel" aria-selected="true">Painel</button>
      <button class="aba" role="tab" data-aba="config" aria-selected="false">Configuração</button>
    </div>
    <div id="avisos"></div>
    <main id="conteudo"></main>
  </div>
  <script src="/s/nav.js" type="module"></script>
  <script type="module" src="/s/umbler.js"></script>
</body>
</html>
